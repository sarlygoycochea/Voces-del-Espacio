<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | VOCES DEL ESPACIO</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #100c35, #24205e, #07152e);
            color: white;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(85%, 380px);
            padding: 30px;
            background: #191943;
            border-radius: 18px;
            text-align: center;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 13px;
            margin: 9px 0;
            border-radius: 8px;
            border: 0;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            background: #f7ce70;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #f7ce70; }
    </style>
</head>
<body>
<main>
    <h1>🚀 Crear cuenta</h1>
    <p>Únete a VOCES DEL ESPACIO</p>

    {% for mensaje in get_flashed_messages() %}
        <p>{{ mensaje }}</p>
    {% endfor %}

    <form method="POST">
        <input name="nombre" placeholder="Nombre completo" required>
        <input name="correo" type="email" placeholder="Correo electrónico" required>
        <input name="password" type="password"
               placeholder="Contraseña (mínimo 8 caracteres)"
               minlength="8" required>
        <button type="submit">Registrarme</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    <a href="/">Volver al inicio</a>
</main>
</body>
</html>
