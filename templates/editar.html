<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editar historia</title>
<style>
body {
    background: #100c35;
    color: white;
    font-family: Arial, sans-serif;
    padding: 25px;
}
main {
    max-width: 650px;
    margin: auto;
    background: #191943;
    padding: 25px;
    border-radius: 15px;
}
input, textarea, select {
    box-sizing: border-box;
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 0;
    border-radius: 7px;
}
button {
    padding: 12px 20px;
    background: #f7ce70;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}
a { color: #f7ce70; }
</style>
</head>
<body>
<main>
<h1>Editar historia espacial</h1>

{% for mensaje in get_flashed_messages() %}
<p>{{ mensaje }}</p>
{% endfor %}

<form method="POST">
    <input name="titulo" value="{{ historia.titulo }}" required>
    <input name="explorador" value="{{ historia.explorador }}" required>
    <input name="planeta" value="{{ historia.planeta }}" required>
    <input name="resumen" value="{{ historia.resumen or '' }}">

    <textarea name="contenido" rows="7" required>{{ historia.contenido }}</textarea>

    <select name="idioma">
        <option value="español" {% if historia.idioma == 'español' %}selected{% endif %}>Español</option>
        <option value="inglés" {% if historia.idioma == 'inglés' %}selected{% endif %}>Inglés</option>
    </select>

    <input name="audio_url" value="{{ historia.audio_url or '' }}">

    <button type="submit">Guardar cambios</button>
</form>

<p><a href="{{ url_for('admin_historias') }}">Volver al panel</a></p>
</main>
</body>
</html>
